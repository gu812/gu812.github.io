# ============================================================
# Butterfly 主题配置文件（主题版本 5.x）
# 官方文档：https://butterfly.js.org/posts/4aa8abbe/
# 说明：只写需要覆盖默认值的配置项，其余保持主题默认。
# 注意：不要把配置项写成空值（会把主题默认值覆盖成 null 导致报错），
#       要改就填具体的值，不改就整行注释掉。
# ============================================================

# ------------------------------------------------------------
# 菜单（左上角的页面链接）
# ------------------------------------------------------------
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  友链: /link/ || fas fa-link
  关于: /about/ || fas fa-heart

# ------------------------------------------------------------
# 首页顶部大图 / 文章默认封面（当前使用 Butterfly 自带默认图）
# ------------------------------------------------------------
# 【换图指南】想换成自己的动漫图片：
#   1. 把图片放到 source/img/ 目录下（自己新建这个目录，例如 source/img/top.jpg）
#   2. 把下面对应配置项取消注释，改成 /img/top.jpg（也可以直接填图片 URL）
#   3. npx hexo clean && npx hexo generate 重新生成即可

# 首页最上方的横幅大图
# index_img: /img/top.jpg

# 归档 / 标签 / 分类 / 关于等页面的顶部大图
# default_top_img: /img/top.jpg

# 文章页顶部大图（文章 front-matter 里没写 cover/top_img 时用），可配多张随机轮换：
# default_cover:
#   - /img/cover1.jpg
#   - /img/cover2.jpg

# 文章列表里没配封面的文章显示的缩略图（图片加载失败时的兜底图）
# error_img:
#   flink: /img/error.jpg
#   post_page: /img/error.jpg

# ------------------------------------------------------------
# 头像（首页右侧信息卡 & 关于页）
# 【换图指南】把图片放到 source/img/avatar.png，然后改成：
# avatar:
#   img: /img/avatar.png
# ------------------------------------------------------------

# ------------------------------------------------------------
inject:
  head:
    # 自定义样式：首页星网 hero、页面转场、想法时间线、卡片网格
    - <link rel="stylesheet" href="/css/custom.css">
    # Noto Serif SC 自托管字体（文章页衬线正文用）
    - <link rel="stylesheet" href="/fonts/noto-serif-sc/noto-serif-sc.css">
    # 文章页极简排版（.post-minimal）
    - <link rel="stylesheet" href="/css/post-minimal.css">
    # 首页渲染前给 <html> 加 globe-home，隐藏 Butterfly 顶部 banner（菜单保留）
    - <script>if(location.pathname==='/'||location.pathname==='/index.html')document.documentElement.classList.add('globe-home')</script>
  bottom:
    # 星网导航 hero：脚本自身只在首页初始化（three.js/vanta 也只在首页才动态加载）
    - <script src="/js/globe-hero.js" defer></script>
    # 文章卡片变形交互（.morph-*）：作用于列表页 .post-card
    - <script src="/js/morph-cards.js" defer></script>
    # 文章页标题 glitch 归位：脚本自身只在文章页初始化
    - <script src="/js/post-minimal.js?v=5" defer></script>
    # 分页面棱镜 banner + 开屏粒子标题：脚本自身只在分页面初始化
    - <script src="/js/prism-banner.js" defer></script>
    - <script src="/js/page-intro.js" defer></script>

# ------------------------------------------------------------
# 侧栏：分页面侧栏在左且收窄，只保留最近文章/分类/标签；
# 文章页极简排版独占中栏，不显示侧栏
# ------------------------------------------------------------
aside:
  position: left
  display:
    post: false
  card_author:
    enable: false
  card_announcement:
    enable: false
  card_archives:
    enable: false
  card_webinfo:
    enable: false

# ------------------------------------------------------------
# 字数统计（文章页元信息的阅读时长用）
# ------------------------------------------------------------
wordcount:
  enable: true
  post_wordcount: false
  min2read: true
  total_wordcount: false

# ------------------------------------------------------------
# 页脚
# ------------------------------------------------------------
footer:
  owner:
    enable: true
    since: 2026
  custom_text: 'Powered by <a href="https://hexo.io/">Hexo</a> | Theme <a href="https://butterfly.js.org/">Butterfly</a>'

# ------------------------------------------------------------
# 社交链接（按自己的账号修改，不想要哪行就删掉）
# 格式：链接 || 图标 || 悬停文字
# ------------------------------------------------------------
social:
  fab fa-github: https://github.com/gu812 || Github || '去 GitHub 逛逛'

# ------------------------------------------------------------
# 代码高亮主题
# 可选：light / darker / pale night / ocean / mac / mac light
# ------------------------------------------------------------
highlight_theme: mac

# ------------------------------------------------------------
# 404 页面：主题会自动生成 404.html（GitHub Pages 自动使用）
# ------------------------------------------------------------
error_404:
  enable: true
  subtitle: '这个页面不存在'
